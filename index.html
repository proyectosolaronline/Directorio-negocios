<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Directorio de Negocios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ===== MOBILE FIRST: estilos base = celular ===== */
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0A0E17; color:#E0E0E0; padding-bottom:calc(90px + env(safe-area-inset-bottom)); }
  button, a { touch-action:manipulation; }

  .mini-banner {
    width:100%; min-height:110px; padding:12px 14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background: linear-gradient(rgba(10,14,23,.35),rgba(10,14,23,.6)), url('imagen/banner.jpg') center/cover no-repeat, linear-gradient(135deg,#7B2FF7,#FF00E5,#00D4FF);
  }
  .mini-banner h1 { font-size:13px; font-weight:600; letter-spacing:.3px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.8); margin-top:8px; }
  .search-wrap { width:100%; max-width:560px; }
  #buscador { width:100%; min-height:42px; padding:8px 16px; border-radius:30px; border:none; font-size:16px; outline:none; box-shadow:0 4px 18px rgba(0,0,0,.35); }

  .contenedor { max-width:1100px; margin:16px auto; padding:0 14px; }
  #contador { font-size:13px; color:#888; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr; gap:14px; }
  .card { background:#1A1A2E; border-radius:16px; overflow:hidden; border:1px solid #2A2A4A; cursor:pointer; }
  .card:active { transform:scale(.99); }
  .card-head { display:flex; align-items:center; gap:12px; padding:16px 14px 6px; }
  .card-logo { width:56px; height:56px; flex:0 0 56px; border-radius:50%; object-fit:cover; border:3px solid #00D4FF; background:#0D1117; }
  .card-logo-vacio { display:flex; align-items:center; justify-content:center; font-size:24px; }
  .card-head h3 { font-size:16px; line-height:1.3; }
  .card-body { padding:6px 14px 14px; }
  .card-body p { font-size:13.5px; color:#AAA; line-height:1.5; margin-bottom:12px; min-height:20px; }
  .ver-mas { color:#00D4FF; font-weight:700; white-space:nowrap; }
  .card-actions { display:flex; gap:8px; }
  .btn-mini { flex:1; display:flex; align-items:center; justify-content:center; min-height:44px; text-align:center; padding:8px; border-radius:10px; font-size:13px; font-weight:700; text-decoration:none; border:none; cursor:pointer; }
  .btn-mapa { background:#00D4FF; color:#0A0E17; }
  .btn-ver { background:#7B2FF7; color:#fff; }
  .empty { text-align:center; padding:60px 20px; color:#888; grid-column:1/-1; }

  /* Modales: en celular ocupan toda la pantalla */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:2000; align-items:stretch; justify-content:center; padding:0; }
  .modal-overlay.active { display:flex; }
  .modal-mapa { background:#1A1A2E; width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
  .modal-mapa-header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top)); background:#0D1117; }
  .modal-mapa-header h2 { font-size:16px; }
  .modal-mapa-header button { background:none; border:none; color:#CCC; font-size:30px; width:44px; height:44px; cursor:pointer; }
  .mapa-buscar { padding:8px 12px; background:#0D1117; border-top:1px solid #2A2A4A; }
  #buscadorMapa { width:100%; min-height:42px; padding:8px 16px; border-radius:30px; border:none; font-size:16px; outline:none; }
  .gps-fila { display:flex; align-items:center; gap:10px; margin-top:8px; }
  #btnGps { flex:0 0 auto; min-height:42px; padding:8px 14px; border:none; border-radius:30px; background:#00D4FF; color:#0A0E17; font-size:13px; font-weight:700; cursor:pointer; }
  #btnGps.activo { background:#25D366; }
  .gps-radio { flex:1; display:none; align-items:center; gap:8px; }
  .gps-radio.visible { display:flex; }
  .gps-radio input { flex:1; min-width:0; accent-color:#00D4FF; height:32px; }
  #radioTxt { font-size:13px; font-weight:700; color:#00D4FF; min-width:44px; text-align:right; }
  .gps-msg { font-size:12px; color:#FFB74D; margin-top:6px; display:none; }
  .gps-msg.visible { display:block; }
  .user-punto { width:18px; height:18px; border-radius:50%; background:#4285F4; border:3px solid #fff; box-shadow:0 0 0 6px rgba(66,133,244,.3); }
  .card-tit { min-width:0; }
  .badge-del { display:inline-block; margin-top:3px; padding:2px 8px; border-radius:20px; background:rgba(255,152,0,.15); border:1px solid #FF9800; color:#FFB74D; font-size:11px; font-weight:700; }
  .card-dist { font-size:12px; color:#00D4FF; font-weight:700; margin-top:2px; }
  .chip-gps { display:inline-block; margin-left:8px; padding:4px 10px; border-radius:20px; border:1px solid #00D4FF; background:none; color:#00D4FF; font-size:12px; cursor:pointer; }
  #mapaGeneral { flex:1; min-height:300px; }
  /* Pin con logo y nombre */
  .pin-neg { display:flex; flex-direction:column; align-items:center; width:110px; margin-left:-55px; margin-top:-62px; pointer-events:auto; }
  .pin-logo { width:40px; height:40px; border-radius:50%; object-fit:cover; background:#0D1117; border:3px solid #00D4FF; box-shadow:0 2px 8px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .pin-nombre { margin-top:3px; max-width:110px; padding:2px 7px; border-radius:8px; background:rgba(10,14,23,.92); color:#fff; font-size:11px; font-weight:700; text-align:center; line-height:1.25; white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .pin-punta { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid #00D4FF; margin-top:2px; }
  .leaflet-div-icon.pin-wrap { background:none; border:none; }

  /* Ficha del negocio (datos desde Google Sheet): hoja a pantalla completa */
  #modalFicha { z-index:2500; }
  .ficha { background:#1A1A2E; width:100%; height:100%; overflow-y:auto; position:relative; padding-bottom:env(safe-area-inset-bottom); }
  .ficha-banner { height:170px; background:linear-gradient(135deg,#7B2FF7,#FF00E5,#00D4FF); background-size:cover; background-position:center; position:relative; }
  .ficha-cerrar { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; width:44px; height:44px; border-radius:50%; border:none; background:rgba(0,0,0,.6); color:#fff; font-size:26px; cursor:pointer; z-index:2; }
  .ficha-logo-wrap { max-width:640px; margin:0 auto; position:relative; height:0; }
  .ficha-logo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #00D4FF; position:absolute; left:16px; top:-36px; background:#1A1A2E; }
  .ficha-body { padding:46px 16px 24px; max-width:640px; margin:0 auto; }
  .ficha-body h2 { font-size:20px; margin-bottom:4px; }
  .ficha-slogan { font-size:13px; color:#00D4FF; margin-bottom:8px; }
  .ficha-desc { font-size:14px; color:#BBB; line-height:1.6; margin-bottom:14px; white-space:pre-line; }
  .ficha-info { font-size:13px; color:#CCC; margin-bottom:6px; }
  .ficha-fotos-t { font-size:14px; font-weight:700; margin:14px 0 8px; }
  .ficha-fotos { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .ficha-foto { background:#0D1117; border-radius:10px; overflow:hidden; border:1px solid #2A2A4A; }
  .ficha-foto img { width:100%; height:110px; object-fit:cover; display:block; }
  .ficha-foto div { padding:7px 8px; font-size:11.5px; line-height:1.4; }
  .ficha-foto b { display:block; color:#fff; margin-bottom:2px; }
  .ficha-foto span { color:#AAA; }
  .ficha-btns { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .ficha-btns a { display:flex; align-items:center; justify-content:center; min-height:48px; padding:10px; border-radius:10px; font-size:14px; font-weight:700; text-decoration:none; color:#fff; }
  .fb-ir { background:#00D4FF; color:#0A0E17 !important; }
  .fb-wa { background:#25D366; }
  .fb-tel { background:#7B2FF7; }
  .fb-land { background:linear-gradient(135deg,#7B2FF7,#FF00E5); display:none !important; }
  .fb-land.visible { display:flex !important; }

  /* Tarjeta del pin en el mapa */
  .popup-negocio { font-family:'Segoe UI',system-ui,sans-serif; width:200px; }
  .popup-negocio .pop-banner { width:100%; height:70px; border-radius:8px; margin-bottom:6px; background:linear-gradient(135deg,#7B2FF7,#00D4FF); }
  .popup-negocio h4 { font-size:13.5px; margin-bottom:4px; color:#111; }
  .popup-negocio p { font-size:11.5px; color:#444; margin-bottom:8px; line-height:1.4; }
  .popup-negocio .pop-actions { display:flex; gap:6px; }
  .popup-negocio .pop-btn { flex:1; display:flex; align-items:center; justify-content:center; min-height:36px; text-align:center; padding:4px; border-radius:7px; font-size:11px; font-weight:700; text-decoration:none; border:none; cursor:pointer; }
  .pop-btn-ir { background:#00D4FF; color:#0A0E17; }
  .pop-btn-ver { background:#7B2FF7; color:#fff; }

  /* Botón flotante del mapa (zona del pulgar, derecha) */
  .fab-mapa {
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg,#7B2FF7,#FF00E5,#00D4FF);
    color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; z-index:1500;
    box-shadow:0 0 25px rgba(123,47,247,.6), 0 0 50px rgba(0,212,255,.4);
    animation:fabPulse 1.8s infinite;
  }
  .fab-mapa:active { transform:scale(.92); }
  @keyframes fabPulse {
    0%   { transform:scale(1);    box-shadow:0 0 20px rgba(123,47,247,.55), 0 0 40px rgba(0,212,255,.35); }
    50%  { transform:scale(1.12); box-shadow:0 0 35px rgba(123,47,247,.9), 0 0 65px rgba(0,212,255,.6); }
    100% { transform:scale(1);    box-shadow:0 0 20px rgba(123,47,247,.55), 0 0 40px rgba(0,212,255,.35); }
  }
  .fab-mapa .fab-tooltip { display:none; }
  @media (prefers-reduced-motion:reduce){ .fab-mapa { animation:none; } }

  /* ===== TABLET (600px+) ===== */
  @media (min-width:600px){
    .mini-banner { min-height:130px; padding:16px; }
    .mini-banner h1 { font-size:14px; }
    .contenedor { padding:0 16px; margin:24px auto; }
    .grid { grid-template-columns:repeat(2,1fr); gap:18px; }
    .modal-overlay { align-items:center; padding:16px; }
    .modal-mapa { max-width:720px; height:auto; border-radius:16px; border:1px solid #7B2FF7; }
    #mapaGeneral { flex:none; height:460px; }
  }

  /* ===== ESCRITORIO (900px+) ===== */
  @media (min-width:900px){
    .grid { grid-template-columns:repeat(3,1fr); }
    .card { transition:transform .2s, box-shadow .2s; }
    .card:hover { transform:translateY(-4px); box-shadow:0 0 25px rgba(0,212,255,.25); }
    .fab-mapa { width:62px; height:62px; font-size:26px; right:22px; bottom:22px; }
    .fab-mapa .fab-tooltip {
      display:block; position:absolute; right:72px; top:50%; transform:translateY(-50%);
      background:#222; color:#fff; padding:6px 12px; border-radius:8px;
      font-size:12.5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    .fab-mapa:hover .fab-tooltip { opacity:1; }
  }
</style>
</head>
<body>

<div class="mini-banner" id="miniBanner">
  <div class="search-wrap">
    <input type="text" id="buscador" placeholder="Busca un negocio o producto...">
  </div>
  <h1>🔎 Directorio de Negocios</h1>
</div>

<div class="contenedor">
  <div id="contador"></div>
  <div class="grid" id="grid"></div>
</div>

<button class="fab-mapa" id="btnVerMapa" aria-label="Abrir negocios en mapa">
  📍
  <span class="fab-tooltip">Ver negocios en mapa</span>
</button>

<!-- Ficha del negocio -->
<div class="modal-overlay" id="modalFicha">
  <div class="ficha" id="fichaContenido"></div>
</div>

<!-- Modal mapa general -->
<div class="modal-overlay" id="modalMapaOverlay">
  <div class="modal-mapa">
    <div class="modal-mapa-header">
      <h2>🗺️ Negocios en el mapa</h2>
      <button onclick="cerrarMapaGeneral()">&times;</button>
    </div>
    <div class="mapa-buscar">
      <input type="text" id="buscadorMapa" placeholder="Busca un negocio o producto...">
      <div class="gps-fila">
        <button type="button" id="btnGps">📡 Cerca de mí</button>
        <label class="gps-radio" id="gpsRadioWrap">
          <input type="range" id="radioKm" min="1" max="10" step="1" value="5">
          <span id="radioTxt">5 km</span>
        </label>
      </div>
      <div class="gps-msg" id="gpsMsg"></div>
    </div>
    <div id="mapaGeneral"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzC0XThmPutT8VjPMyYiRrvVIREMr3LfHeRIYsFFJ8wT_H-3vmKcaAuqbz337BahBmPeg/exec';

let negocios = [];
let mapaGeneral = null;
let markersLayer = null;

function callAPI(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
    window[cb] = function(result) {
      delete window[cb];
      document.body.removeChild(script);
      resolve(result);
    };
    let url = `${APPS_SCRIPT_URL}?action=${action}&callback=${cb}`;
    for (const k in params) url += `&${k}=${encodeURIComponent(params[k])}`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = function(){ delete window[cb]; document.body.removeChild(script); reject(new Error('Error de conexión')); };
    document.body.appendChild(script);
  });
}

function escHTML(t){ return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- Misma lógica que generar-landing.html y generar-delivery.html ---
function nombreVisible(nombre){
  return String(nombre || 'Negocio').split('&')[0].trim() || 'Negocio';
}
function nombreCarpeta(nombre){
  return String(nombreVisible(nombre)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ñ/gi,'n').replace(/[^a-zA-Z0-9\s-]/g,'').trim().replace(/\s+/g,'-').toLowerCase();
}
// Un negocio es de delivery cuando su nombre en el Sheet lleva "& Delivery"
function esDelivery(n){ return /&\s*delivery/i.test(String((n && n.nombre) || '')); }
function urlLanding(n){
  return `https://proyectosolaronline.github.io/${encodeURIComponent(nombreCarpeta(n.nombre))}/`;
}

// ===== GPS: negocios cercanos =====
let ubic = null;            // {lat,lng} del celular
let radioKm = 5;            // 1 a 10 km
let capaUsuario = null;

function distKm(n){
  if (!ubic) return null;
  const R = 6371, rad = Math.PI/180;
  const dLat = (parseFloat(n.latitud)-ubic.lat)*rad, dLng = (parseFloat(n.longitud)-ubic.lng)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(ubic.lat*rad)*Math.cos(parseFloat(n.latitud)*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDist(k){ return k < 1 ? Math.round(k*1000)+' m' : k.toFixed(1)+' km'; }

// Negocios filtrados por texto y, si hay GPS, por radio (ordenados del más cercano al más lejano)
function negociosVisibles(term){
  let lista = term ? negocios.filter(n => textoBusqueda(n).includes(term)) : negocios.slice();
  if (ubic) {
    lista = lista.filter(n => { const d = distKm(n); return d !== null && !isNaN(d) && d <= radioKm; });
    lista.sort((a,b) => distKm(a) - distKm(b));
  }
  return lista;
}

function gpsMensaje(t){
  const m = document.getElementById('gpsMsg');
  m.textContent = t || ''; m.classList.toggle('visible', !!t);
}
function quitarGps(){
  ubic = null;
  document.getElementById('btnGps').classList.remove('activo');
  document.getElementById('btnGps').textContent = '📡 Cerca de mí';
  document.getElementById('gpsRadioWrap').classList.remove('visible');
  gpsMensaje('');
  renderizarGrid();
  if (mapaGeneral) pintarMarcadores(true);
}
function activarGps(){
  if (ubic) { quitarGps(); return; }
  if (!navigator.geolocation) { gpsMensaje('Tu navegador no permite usar el GPS.'); return; }
  const b = document.getElementById('btnGps');
  b.textContent = '⏳ Ubicando...';
  gpsMensaje('');
  navigator.geolocation.getCurrentPosition(pos => {
    ubic = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    b.classList.add('activo'); b.textContent = '✅ Quitar GPS';
    document.getElementById('gpsRadioWrap').classList.add('visible');
    renderizarGrid();
    pintarMarcadores(true);
  }, err => {
    b.textContent = '📡 Cerca de mí';
    gpsMensaje(err.code === 1 ? 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador.' : 'No se pudo obtener tu ubicación. Intenta de nuevo.');
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}

// Muestra solo 40 caracteres; el resto se ve en "ver más" (abre la ficha)
function descCorta(d){
  const t = String(d||'').replace(/\s+/g,' ').trim();
  if (t.length <= 40) return escHTML(t);
  return escHTML(t.slice(0,40).trimEnd()) + '… <span class="ver-mas">ver más</span>';
}

function textoBusqueda(n){
  const fotosTxt = (n.fotos||[]).map(f => f && f.descripcion ? f.descripcion : '').join(' ');
  return [n.nombre, n.descripcion, n.slogan, fotosTxt].join(' ').toLowerCase();
}

async function cargarNegocios(){
  document.getElementById('contador').textContent = 'Cargando negocios...';
  try {
    const result = await callAPI('obtenerNegocios');
    if (result.success) {
      negocios = (result.negocios||[]).filter(n => n.activo && n.latitud && n.longitud);
      renderizarGrid();
    } else {
      document.getElementById('contador').textContent = 'Error al cargar negocios';
    }
  } catch(e) {
    document.getElementById('contador').textContent = 'Error de conexión';
  }
}

function renderizarGrid(){
  const term = document.getElementById('buscador').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const filtrados = negociosVisibles(term);
  document.getElementById('contador').innerHTML = ubic
    ? `📡 ${filtrados.length} negocio(s) a ${radioKm} km o menos de ti <button class="chip-gps" onclick="quitarGps()">Quitar GPS</button>`
    : `Mostrando ${filtrados.length} de ${negocios.length} negocios`;
  if (!filtrados.length) {
    grid.innerHTML = `<div class="empty">😕 No se encontraron negocios${ubic?' cerca de ti. Sube el radio en el mapa.':''}</div>`;
    return;
  }
  grid.innerHTML = filtrados.map(n => `
    <div class="card" onclick="abrirFicha(${negocios.indexOf(n)})">
 <div class="card-head">
        ${n.logo ? `<img class="card-logo" src="${escHTML(n.logo)}" alt="" onerror="this.outerHTML='<div class=&quot;card-logo card-logo-vacio&quot;>🏪</div>'">` : `<div class="card-logo card-logo-vacio">🏪</div>`}
        <div class="card-tit"><h3>${escHTML(nombreVisible(n.nombre))}</h3>${esDelivery(n)?'<span class="badge-del">🛵 Delivery</span>':''}${ubic?`<div class="card-dist">📡 a ${fmtDist(distKm(n))}</div>`:''}</div>
      </div>
      <div class="card-body">
        <p>${descCorta(n.descripcion)}</p>
        <div class="card-actions">
          <a class="btn-mini btn-mapa" href="https://www.google.com/maps/dir/?api=1&destination=${n.latitud},${n.longitud}" target="_blank" onclick="event.stopPropagation()">🧭 Cómo llegar</a>
                    <a class="btn-mini btn-ver" href="${urlLanding(n)}" target="_blank" onclick="event.stopPropagation()">🌐 Ver negocio</a>
        </div>
      </div>
    </div>
  `).join('');
}

document.getElementById('buscador').addEventListener('input', renderizarGrid);

// ===== FICHA DEL NEGOCIO (datos del Google Sheet) =====
function abrirFicha(i){
  const n = negocios[i];
  if (!n) return;
  const fotos = (n.fotos||[]).filter(f => f && f.url);
  const tel = String(n.telefono||'').replace(/[^\d+]/g,'');
  const wa  = String(n.whatsapp||'').replace(/\D/g,'');
  const fotosHTML = fotos.length ? `
    <div class="ficha-fotos-t">🛍️ Productos y servicios</div>
    <div class="ficha-fotos">${fotos.map(f => {
      const p = (f.descripcion||'').split('&');
      const titulo = (p[0]||'').trim();
      const desc = p.slice(1).join('&').trim();
      return `<div class="ficha-foto"><img src="${escHTML(f.url)}" alt="" onerror="this.style.display='none'">
        <div>${titulo?`<b>${escHTML(titulo)}</b>`:''}${desc?`<span>${escHTML(desc)}</span>`:''}</div></div>`;
    }).join('')}</div>` : '';
  document.getElementById('fichaContenido').innerHTML = `
    <div class="ficha-banner" style="${n.banner?`background-image:url('${escHTML(n.banner)}');`:''}">
      <button class="ficha-cerrar" onclick="cerrarFicha()">&times;</button>
    </div>
    <div class="ficha-logo-wrap">${n.logo?`<img class="ficha-logo" src="${escHTML(n.logo)}" alt="" onerror="this.style.display='none'">`:''}</div>
    <div class="ficha-body">
      <h2>${escHTML(nombreVisible(n.nombre))}</h2>
      ${esDelivery(n)?'<div class="badge-del">🛵 Delivery a domicilio</div>':''}
      ${n.slogan?`<div class="ficha-slogan">${escHTML(n.slogan)}</div>`:''}
      ${n.descripcion?`<div class="ficha-desc">${escHTML(n.descripcion)}</div>`:''}
      ${n.direccion?`<div class="ficha-info">📍 ${escHTML(n.direccion)}</div>`:''}
      ${n.horario?`<div class="ficha-info">🕐 ${escHTML(n.horario)}</div>`:''}
      ${fotosHTML}
      <div class="ficha-btns">
        <a class="fb-ir" href="https://www.google.com/maps/dir/?api=1&destination=${n.latitud},${n.longitud}" target="_blank">🧭 Cómo llegar</a>
        ${wa?`<a class="fb-wa" href="https://wa.me/${wa}" target="_blank">💬 WhatsApp</a>`:''}
        ${tel?`<a class="fb-tel" href="tel:${tel}">📞 Llamar</a>`:''}
        <a class="fb-land" id="fichaLanding" href="${urlLanding(n)}" target="_blank">${esDelivery(n)?'🛵 Hacer pedido':'🌐 Abrir página completa'}</a>
      </div>
    </div>`;
  document.getElementById('modalFicha').classList.add('active');
  // El link a la landing solo aparece si ese negocio ya está publicado
  fetch(urlLanding(n), { method:'HEAD' }).then(r => {
    const a = document.getElementById('fichaLanding');
    if (r.ok && a) a.classList.add('visible');
  }).catch(() => {});
}
function cerrarFicha(){
  document.getElementById('modalFicha').classList.remove('active');
  // Si veníamos del mapa, se vuelven a pintar los pines y el mapa queda donde estaba
  if (mapaGeneral && document.getElementById('modalMapaOverlay').classList.contains('active')) {
    mapaGeneral.invalidateSize();
    pintarMarcadores(false);
  }
}
document.getElementById('modalFicha').addEventListener('click', function(e){ if (e.target===this) cerrarFicha(); });

// ===== MAPA GENERAL CON TODOS LOS NEGOCIOS =====
function iconoPin(n){
  const logo = n.logo
    ? `<img class="pin-logo" src="${escHTML(n.logo)}" alt="" onerror="this.outerHTML='<div class=&quot;pin-logo&quot;>🏪</div>'">`
    : `<div class="pin-logo">🏪</div>`;
  return L.divIcon({
    className: 'pin-wrap',
    html: `<div class="pin-neg">${logo}<div class="pin-nombre">${esDelivery(n)?'🛵 ':''}${escHTML(nombreVisible(n.nombre))}</div><div class="pin-punta"></div></div>`,
    iconSize: [0,0]
  });
}

function pintarMarcadores(ajustar){
  if (!mapaGeneral) return;
  const term = document.getElementById('buscadorMapa').value.trim().toLowerCase();
  const lista = negociosVisibles(term);
  markersLayer.clearLayers();
  if (capaUsuario) { mapaGeneral.removeLayer(capaUsuario); capaUsuario = null; }
  let circulo = null;
  if (ubic) {
    capaUsuario = L.layerGroup().addTo(mapaGeneral);
    circulo = L.circle([ubic.lat,ubic.lng], { radius: radioKm*1000, color:'#00D4FF', weight:2, fillColor:'#00D4FF', fillOpacity:.08 }).addTo(capaUsuario);
    L.marker([ubic.lat,ubic.lng], { icon: L.divIcon({ className:'pin-wrap', html:'<div class="user-punto"></div>', iconSize:[18,18], iconAnchor:[9,9] }), interactive:false, zIndexOffset:-500 }).addTo(capaUsuario);
  }
  const bounds = [];
  lista.forEach(n => {
    const lat = parseFloat(n.latitud), lng = parseFloat(n.longitud);
    if (isNaN(lat) || isNaN(lng)) return;
    bounds.push([lat,lng]);
    const idx = negocios.indexOf(n);
    L.marker([lat,lng], { icon: iconoPin(n) }).addTo(markersLayer).on('click', () => abrirFicha(idx));
  });
  if (ajustar !== false) {
    if (circulo) mapaGeneral.fitBounds(circulo.getBounds(), { padding:[30,30] });
    else if (bounds.length) mapaGeneral.fitBounds(bounds, { padding:[60,60], maxZoom:17 });
    else if (!term) mapaGeneral.setView([20.5888,-100.3899], 12);
  }
}

function abrirMapaGeneral(){
  document.getElementById('modalMapaOverlay').classList.add('active');
  setTimeout(() => {
    if (!mapaGeneral) {
      mapaGeneral = L.map('mapaGeneral');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(mapaGeneral);
      markersLayer = L.layerGroup().addTo(mapaGeneral);
    }
    mapaGeneral.invalidateSize();
    pintarMarcadores(true);
  }, 150);
}

document.getElementById('buscadorMapa').addEventListener('input', () => pintarMarcadores(true));
document.getElementById('btnGps').addEventListener('click', activarGps);
document.getElementById('radioKm').addEventListener('input', function(){
  radioKm = parseInt(this.value,10);
  document.getElementById('radioTxt').textContent = radioKm + ' km';
  renderizarGrid();
  pintarMarcadores(true);
});

function cerrarMapaGeneral(){
  document.getElementById('modalMapaOverlay').classList.remove('active');
}

document.getElementById('btnVerMapa').addEventListener('click', abrirMapaGeneral);
document.getElementById('modalMapaOverlay').addEventListener('click', function(e){ if (e.target===this) cerrarMapaGeneral(); });

cargarNegocios();
</script>
